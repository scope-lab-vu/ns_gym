name: Python package Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  undefined-names:
    # A name that is used but never defined is a NameError waiting for the
    # first call. The files excluded below are unmaintained scripts with known
    # ones; drop each exclusion when its file is fixed or removed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check for undefined names
        run: >
          uvx ruff check --select F821 ns_gym tests
          --per-file-ignores "ns_gym/benchmark_algorithms/AlphaZero/data_generation.py:F821"
          --per-file-ignores "ns_gym/benchmark_algorithms/AlphaZero/nn_training.py:F821"
          --per-file-ignores "ns_gym/benchmark_algorithms/rats-experiments/nsbridge_experiment.py:F821"

  test: # Changed job name to be more descriptive
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            tox_env: py310
          - python: "3.11"
            tox_env: py311
          - python: "3.12"
            tox_env: py312
          - python: "3.13"
            tox_env: py313 # Make sure you have a py313 env defined in tox.ini

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tox and tox-uv
        run: uv pip install tox tox-uv --system

      - name: Run tox -e ${{ matrix.tox_env }}
        run: tox -e ${{ matrix.tox_env }}